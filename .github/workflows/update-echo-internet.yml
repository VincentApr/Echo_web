name: Update EchoInternet submodule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-echo-internet-main
  cancel-in-progress: false

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check target repository token
        env:
          TARGET_TOKEN: ${{ secrets.ECHO_INTERNET_TOKEN }}
        run: |
          if [ -z "$TARGET_TOKEN" ]; then
            echo "::error::Add the ECHO_INTERNET_TOKEN Actions secret with Contents read/write access to VincentApr/EchoInternet."
            exit 1
          fi

      - name: Check out EchoInternet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: VincentApr/EchoInternet
          ref: main
          token: ${{ secrets.ECHO_INTERNET_TOKEN }}
          submodules: false

      - name: Update the pinned Echo_web commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Re-read both branches on retry to preserve concurrent changes and
          # avoid rolling back to an older push when workflow runs are queued.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            expected_url='https://github.com/AntoineSal/Echo_web.git'
            test "$(git config -f .gitmodules submodule.Echo_web-main.url)" = "$expected_url"
            test "$(git ls-files --stage Echo_web-main | awk '{print $1}')" = '160000'
            source_sha=$(git ls-remote "$expected_url" refs/heads/main | awk '{print $1}')
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]

            # Updating the gitlink does not require the nested mobile repository.
            git update-index --cacheinfo "160000,$source_sha,Echo_web-main"
            if git diff --cached --quiet; then
              echo 'EchoInternet already points to the latest Echo_web commit.'
              exit 0
            fi

            git commit -m "chore: update Echo_web to ${source_sha:0:7}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying from the latest main."
          done

          echo '::error::Could not update EchoInternet/main after three attempts.'
          exit 1